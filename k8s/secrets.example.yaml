apiVersion: v1
kind: Secret
metadata:
  name: gse-secrets
  namespace: gse-terminal
type: Opaque
stringData:
  postgres-password: "TO_BE_REPLACED"
  jwt-secret: "TO_BE_REPLACED"
  # LLM provider keys — Gemini primary, Anthropic + OpenAI are optional
  # fallbacks consumed by FallbackLLMClient when the primary is throttled.
  # Any of the fallback keys can be left empty; the chain just skips that
  # provider.
  gemini-api-key: "TO_BE_REPLACED"
  anthropic-api-key: "TO_BE_REPLACED"
  openai-api-key: "TO_BE_REPLACED"
  questdb-password: "TO_BE_REPLACED"
  google-client-id: "TO_BE_REPLACED"
  google-client-secret: "TO_BE_REPLACED"
