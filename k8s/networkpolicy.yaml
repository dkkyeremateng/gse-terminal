apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gse-terminal
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gse-app-ingress
  namespace: gse-terminal
spec:
  podSelector:
    matchLabels:
      app: gse-app
  policyTypes: ["Ingress"]
  ingress:
  # Traffic from the GKE L7 LB / health checkers arrives directly at pod IPs
  # via NEGs from Google's infrastructure ranges (130.211.0.0/22, 35.191.0.0/16).
  # Restricting by namespace or pod selector would block it.
  - ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: gse-terminal
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gse-app
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: questdb-ingress
  namespace: gse-terminal
spec:
  podSelector:
    matchLabels:
      app: questdb
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gse-app
    ports:
    - protocol: TCP
      port: 8812
    - protocol: TCP
      port: 9009
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: gse-terminal
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gse-app
    ports:
    - protocol: TCP
      port: 6379
