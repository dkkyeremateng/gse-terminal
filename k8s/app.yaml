apiVersion: apps/v1
kind: Deployment
metadata:
  name: gse-app
  namespace: gse-terminal
  labels:
    app: gse-app
spec:
  # Always-on baseline; the Spot tier (gse-app-spot) provides a second
  # replica when capacity is available. HPA scales this Deployment
  # (1..6) on CPU; the Spot tier is fixed at 1.
  replicas: 1
  selector:
    matchLabels:
      app: gse-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gse-app
    spec:
      serviceAccountName: gse-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: gse-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: gse-app
      containers:
      - name: app
        image: us-central1-docker.pkg.dev/teckdroids/gse/gse-terminal:__IMAGE_TAG__
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_ENV
          value: "production"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_USER
          value: "gse_user"
        - name: POSTGRES_DB
          value: "gse_db"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: postgres-password
        - name: QUESTDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: questdb-password
        # $(QUESTDB_PASSWORD) is substituted by the kubelet from the env var
        # defined immediately above. Order matters — do not move this entry
        # before QUESTDB_PASSWORD.
        - name: QUESTDB_URL
          value: "postgres://admin:$(QUESTDB_PASSWORD)@questdb:8812/qdb?sslmode=disable"
        - name: QUESTDB_ILP_TCP_URL
          value: "questdb:9009"
        - name: REDIS_URL
          value: "redis:6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: jwt-secret
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: gemini-api-key
        # Anthropic (Claude) + OpenAI keys are optional fallbacks wired
        # behind Gemini by FallbackLLMClient. Either secret can be empty;
        # the chain skips that provider at boot. `optional: true` keeps
        # pod startup working before the keys are populated.
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: anthropic-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: openai-api-key
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: google-client-secret
        - name: GOOGLE_REDIRECT_URL
          value: "https://gse.teckdroids.com/auth/google/callback"
        - name: VAPID_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: vapid-public-key
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: gse-secrets
              key: vapid-private-key
        - name: ALLOWED_ORIGINS
          value: "https://gse.teckdroids.com"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            # Headroom for the headless Chromium the 15:30 UTC scrape spawns
            # in-process. Steady-state usage is well under the old 1Gi; the
            # limit only has to survive the daily browser run.
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 24
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gse-app
  namespace: gse-terminal
  annotations:
    # Container-native load balancing — LB sends traffic directly to pod IPs
    # via NEGs instead of going through kube-proxy / iptables.
    cloud.google.com/neg: '{"exposed_ports": {"80":{}}}'
spec:
  type: ClusterIP
  selector:
    app: gse-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gse-app
  namespace: gse-terminal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gse-app
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: gse-app-backend-policy
  namespace: gse-terminal
spec:
  default:
    # WebSocket support: long timeout for persistent connections
    timeoutSec: 3600
    connectionDraining:
      drainingTimeoutSec: 60
    # LB-level access logging is disabled to reduce Cloud Logging cost.
    # The current GCPBackendPolicy CRD on this cluster requires
    # `sampleRate` to be an integer, which makes fractional sampling
    # unavailable. Rely on app-level structured logs (slog) and the
    # Cloud Logging exclusion filters in cost-optimization.md for
    # operational visibility.
    logging:
      enabled: false
  targetRef:
    group: ""
    kind: Service
    name: gse-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gse-app
  namespace: gse-terminal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gse-app
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
